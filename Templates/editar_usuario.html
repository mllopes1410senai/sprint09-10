<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/css/estilo.css">
    <title>Editar perfil</title>
</head>
<body>
    <div class="header">
        <img class="logo_branca" src="/static/img/logo_branca.png" alt="Logo Branca">

        <div class="inicio_relatorio_previsao">
            <a href="{{ url_for('dashboard') }}">Início</a>
            <p>Relatório</p>
            <p>Previsão</p>
        </div>

        <div class="icone_e_nome">
            <div class="icone_user"></div>
            <div class="nome_user">Olá, {{ nome }}</div>
            <a href="{{ url_for('logout') }}" class="logout"><img src="static/img/logout.png" alt="Símbolo da logo"></a>
        </div>
    </div>
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        <div class="flash-messages">
            {%for category, message in messages %}
            <div class="flash {{category}}">{{message}}</div>
            {%endfor%}
        </div>
        {%endif%}
    {%endwith%}
    <div class="container">
        <div class="icone_user_grande"><img src="/static/img/user.png" alt="Foto de usuário"></div>

        <form action="editar" method="post">
            <div class="campos">
                <div class="coluna_esquerda">
                    <label>Nome</label>
                    <input name="nome" type="text" value="{{ usuario[1] }}" >

                    <label>E-mail</label>
                    <input name="email" type="email" value="{{ usuario[2] }}">

                    <label>Senha</label>
                    <a href="{{ url_for('editar_senha') }}" class="botao-senha">Editar senha</a>
                </div>

                <div class="coluna_direita">
                    <label>Valor diário padrão</label>
                    <input name="valor_padrao" type="number" value="{{ usuario[4] }}">

                    <label>Valor diário excepcional</label>
                    <input name="valor_excepcional" type="number" value="{{ usuario[5] }}">

                    <label>Valor por pacote</label>
                    <input name="valor_pacotes" type="number" value="{{ usuario[6] }}">
                </div>
            </div>
            <button type="submit">ATUALIZAR</button>
        </form>
    </div>
</body>
</html>
